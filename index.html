<!DOCTYPE html>
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XORYS Casino & Promos</title>
    <!-- Підключаємо іконки FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0d0d12;
            color: #ffffff;
            background-image: radial-gradient(circle at center, #1a1a24 0%, #0d0d12 100%);
            background-size: 200% 200%;
            background-position: center;
            animation: backgroundMove 15s ease infinite;
            padding-bottom: 90px;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        @keyframes backgroundMove {
            0%, 100% { background-position: center; }
            50% { background-position: center bottom; }
        }

        .page {
            display: none;
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        .page.active {
            display: block;
        }

        .page-title {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 25px;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #ffffff;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.2);
        }

        /* --- СТИЛІ ДЛЯ КАТАЛОГУ (МАРКЕТ) --- */
        .catalog-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
        }

        .catalog-card {
            background: rgba(25. 25. 32. 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            backdrop-filter: blur(10px);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .catalog-card:active {
            transform: scale(0.96);
            border-color: rgba(243, 156, 18, 0.4);
            background: rgba(35, 35, 45, 0.8);
        }

        /* Сяйво всередині картки при наведенні/натисканні */
        .catalog-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
        }

        /* Іконка товару */
        .card-icon {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin-bottom: 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s ease;
        }

        /* Кольорові іконки та неонові акценти */
        .icon-numbers { color: #4facfe; box-shadow: 0 0 15px rgba(79, 172, 254, 0.15); }
        .icon-stars { color: #f6d365; box-shadow: 0 0 15px rgba(246, 211, 101, 0.15); }
        .icon-premium { color: #a18cd1; box-shadow: 0 0 15px rgba(161, 140, 209, 0.15); }
        .icon-usdt { color: #26a17b; box-shadow: 0 0 15px rgba(38, 161, 123, 0.15); }

        .card-title {
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .card-subtitle {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
        }

        /* --- НИЖНЯ ПАНЕЛЬ НАВІГАЦІЇ --- */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 68px;
            background-color: rgba(18, 18, 24, 0.85);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(12px);
            box-shadow: 0 -10px 25px rgba(0, 0, 0, 0.5);
        }

        .nav-item {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            height: 100%;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-item i {
            font-size: 20px;
            margin-bottom: 4px;
        }

        .nav-item span {
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .nav-item.active {
            color: #f39c12;
            transform: translateY(-2px);
            text-shadow: 0 0 10px rgba(243, 156, 18, 0.5);
        }
    </style>
</head>
<body>

    <!-- Вкладка КАЗИНО -->
    <div id="casino" class="page">
        <h1 class="page-title">🎰 КАЗИНО</h1>
        <p style="text-align: center; color: #888;">Ігровий функціонал розробляється...</p>
    </div>

    <!-- Вкладка МАРКЕТ (КАТАЛОГ) -->
    <div id="market" class="page active">
        <h1 class="page-title">🛒 КАТАЛОГ</h1>
        
        <div class="catalog-grid">
            <!-- Картка 1: НОМЕРИ -->
            <div class="catalog-card" onclick="openCategory('Номери')">
                <div class="card-icon icon-numbers">
                    <i class="fa-solid fa-sim-card"></i>
                </div>
                <div class="card-title">НОМЕРИ</div>
                <div class="card-subtitle">Анонімні & Віртуальні</div>
            </div>

            <!-- Картка 2: ЗВЁЗДЫ -->
            <div class="catalog-card" onclick="openCategory('Звёзды')">
                <div class="card-icon icon-stars">
                    <i class="fa-solid fa-star"></i>
                </div>
                <div class="card-title">ЗВЁЗДЫ</div>
                <div class="card-subtitle">Telegram Stars</div>
            </div>

            <!-- Картка 3: TG Premium -->
            <div class="catalog-card" onclick="openCategory('TG Premium')">
                <div class="card-icon icon-premium">
                    <i class="fa-solid fa-gem"></i>
                </div>
                <div class="card-title">TG Premium</div>
                <div class="card-subtitle">Підписка на 3, 6, 12 міс.</div>
            </div>

            <!-- Картка 4: USDT -->
            <div class="catalog-card" onclick="openCategory('USDT')">
                <div class="card-icon icon-usdt">
                    <i class="fa-solid fa-coins"></i>
                </div>
                <div class="card-title">USDT</div>
                <div class="card-subtitle">Крипто-поповнення</div>
            </div>
        </div>
    </div>

    <!-- Вкладка ПРОФІЛЬ -->
    <div id="profile" class="page">
        <h1 class="page-title">👤 ПРОФІЛЬ</h1>
        <p style="text-align: center; color: #888;">Ваш баланс та історія...</p>
    </div>

    <!-- Нижня панель меню -->
    <nav class="bottom-nav">
        <button class="nav-item" onclick="switchPage('casino', this)">
            <i class="fa-solid fa-dice"></i>
            <span>КАЗИНО</span>
        </button>
        <button class="nav-item active" onclick="switchPage('market', this)">
            <i class="fa-solid fa-store"></i>
            <span>МАРКЕТ</span>
        </button>
        <button class="nav-item" onclick="switchPage('profile', this)">
            <i class="fa-solid fa-user"></i>
            <span>ПРОФІЛЬ</span>
        </button>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        function switchPage(pageId, buttonElement) {
            const pages = document.querySelectorAll('.page');
            pages.forEach(page => page.classList.remove('active'));

            document.getElementById(pageId).classList.add('active');

            const buttons = document.querySelectorAll('.nav-item');
            buttons.forEach(btn => btn.classList.remove('active'));
            buttonElement.classList.add('active');
        }

        function openCategory(name) {
            tg.HapticFeedback.impactOccurred('light'); // Вібрація при натисканні в Telegram
            alert('Ви обрали категорію: ' + name);
        }
    </script>

</body>
</html>
