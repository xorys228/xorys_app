<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XORYS Casino & Promos</title>
    <!-- Підключаємо іконки FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            /* Базовий темний колір, як у Телеграмі */
            background-color: #0d0d12;
            color: #ffffff;
            /* Динамічний ефект з скріншоту: створюємо радіальний градієнт, який затемнюється до країв */
            background-image: radial-gradient(circle at center, #1a1a24 0%, #0d0d12 100%);
            background-size: 200% 200%;
            background-position: center;
            /* Плавна анімація фону */
            animation: backgroundMove 15s ease infinite;
            padding-bottom: 80px;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Анімація для руху фону (ефект дихання) */
        @keyframes backgroundMove {
            0%, 100% { background-position: center; }
            50% { background-position: center bottom; }
        }

        /* Стилі для екранів (сторінок) */
        .page {
            display: none;
            width: 100%;
            max-width: 600px;
            padding: 20px;
            text-align: center;
        }

        .page.active {
            display: block;
        }

        h1 {
            margin-top: 40px;
            font-size: 24px;
            color: #f39c12;
            text-shadow: 0 0 10px rgba(243, 156, 18, 0.5);
        }

        /* Нижня панель навігації (як у прикладі на скріншоті) */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 65px;
            background-color: rgba(26, 26, 30, 0.9);
            border-top: 1px solid rgba(45, 45, 53, 0.5);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
            box-shadow: 0 -5px 15px rgba(0,0,0,0.5);
        }

        /* Кнопки меню */
        .nav-item {
            background: none;
            border: none;
            color: rgba(136, 136, 147, 0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            height: 100%;
            cursor: pointer;
            transition: color 0.2s ease, transform 0.2s ease;
        }

        .nav-item i {
            font-size: 20px;
            margin-bottom: 4px;
        }

        .nav-item span {
            font-size: 11px;
            font-weight: 500;
        }

        /* Активна вкладка (як у прикладі на скріншоті) */
        .nav-item.active {
            color: #f39c12;
            transform: translateY(-3px);
            text-shadow: 0 0 8px rgba(243, 156, 18, 0.8);
        }
    </style>
</head>
<body>

    <!-- Вкладка КАЗИНО (🎰) -->
    <div id="casino" class="page active">
        <h1>🎰 КАЗИНО XORYS</h1>
        <p style="margin-top: 20px; color: #aaa;">Тут буде ваш ігровий функціонал та слоти.</p>
    </div>

    <!-- Вкладка МАРКЕТ (🛒) -->
    <div id="market" class="page">
        <h1>🛒 МАРКЕТ XORYS</h1>
        <p style="margin-top: 20px; color: #aaa;">Тут товари, покупки та інвентар.</p>
    </div>

    <!-- Вкладка ПРОФІЛЬ (👤) -->
    <div id="profile" class="page">
        <h1>👤 ПРОФІЛЬ XORYS</h1>
        <p style="margin-top: 20px; color: #aaa;">Ваш баланс, статистика та налаштування.</p>
    </div>

    <!-- Нижня панель меню -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchPage('casino', this)">
            <i class="fa-solid fa-dice"></i>
            <span>КАЗИНО</span>
        </button>
        <button class="nav-item" onclick="switchPage('market', this)">
            <i class="fa-solid fa-store"></i>
            <span>МАРКЕТ</span>
        </button>
        <button class="nav-item" onclick="switchPage('profile', this)">
            <i class="fa-solid fa-user"></i>
            <span>ПРОФІЛЬ</span>
        </button>
    </nav>

    <script>
        // Ініціалізуємо Telegram Web App SDK
        const tg = window.Telegram.WebApp;
        tg.ready();

        // Функція перемикання між сторінками та підсвічування активної іконки
        function switchPage(pageId, buttonElement) {
            // Приховуємо всі сторінки
            const pages = document.querySelectorAll('.page');
            pages.forEach(page => page.classList.remove('active'));

            // Показуємо потрібну сторінку
            document.getElementById(pageId).classList.add('active');

            // Знімаємо клас active з усіх кнопок і додаємо на натиснуту
            const buttons = document.querySelectorAll('.nav-item');
            buttons.forEach(btn => btn.classList.remove('active'));
            buttonElement.classList.add('active');

            // Також можемо міняти заголовок в Telegram, щоб він відповідав сторінці
            tg.MainButton.text = "ЗАПУСТИТИ " + pageId.toUpperCase();
        }
    </script>

</body>
</html>
