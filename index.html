<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XORYS Casino & Promos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #050507;
            color: #ffffff;
            background-image: radial-gradient(circle at 50% 20%, #16161c 0%, #050507 85%);
            background-size: 100% 100%;
            padding-bottom: 75px;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            font-weight: 700;
        }

        .page {
            display: none;
            width: 100%;
            max-width: 500px;
            padding: 16px;
        }

        .page.active {
            display: block;
        }

        .page-title {
            text-align: center;
            margin-top: 10px;
            margin-bottom: 20px;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: #ffffff;
            text-transform: uppercase;
        }

        /* --- КАТАЛОГ МАРКЕТУ --- */
        .catalog-grid {
            display: flex;
            gap: 10px;
            width: 100%;
            justify-content: space-between;
        }

        .catalog-card {
            flex: 1;
            background: rgba(20, 20, 25, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 12px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
        }

        .catalog-card:active {
            transform: scale(0.95);
        }

        .card-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            margin-bottom: 6px;
            background: rgba(255, 255, 255, 0.04);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .card-title {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        /* --- БАНЕР ГРИ НА ЛОБІ --- */
        .game-banner {
            background: linear-gradient(135deg, #121218, #0a0a0f);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 24px 20px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            transition: transform 0.2s ease;
        }

        .game-banner:active {
            transform: scale(0.98);
        }

        .game-banner i {
            font-size: 42px;
            color: #ffffff;
            margin-bottom: 12px;
            filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.4));
        }

        .game-title {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .game-desc {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 4px;
            font-weight: 700;
        }

        /* --- ІГРОВИЙ ЕКРАН --- */
        #rocketGamePage {
            background: #050507;
            min-height: 100vh;
            padding: 12px;
            font-weight: 700;
        }

        .rg-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 4px;
            margin-bottom: 12px;
        }

        .rg-logo {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #ffffff;
        }

        .rg-logo span {
            color: #888893;
            font-weight: 500;
        }

        .rg-balance {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 800;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Історія раундів */
        .rg-history {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 6px;
            margin-bottom: 12px;
        }

        .history-pill {
            background: rgba(25, 25, 32, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 800;
            color: #ffffff;
            white-space: nowrap;
        }

        /* Ігрове поле зі стильним фоном */
        .rg-display {
            height: 220px;
            background: radial-gradient(circle at center, #1b1b2f 0%, #0b0b10 70%, #050507 100%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.8), 0 0 20px rgba(100, 100, 255, 0.1);
        }

        .rg-display::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            transform: perspective(500px) rotateX(60deg);
            bottom: -50px;
            animation: gridMove 10s linear infinite;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 0 40px; }
        }

        .star-point {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            opacity: 0.6;
            box-shadow: 0 0 4px #fff;
        }

        .multiplier-val {
            font-size: 48px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 25px rgba(255, 255, 255, 0.4);
            z-index: 5;
            letter-spacing: 1px;
        }

        /* Персонаж (Дуров) */
        .rocket-container {
            position: absolute;
            bottom: 25px;
            left: 25px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.1s linear;
            z-index: 6;
        }

        .custom-guy {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.7);
            border: 2px solid #38bdf8;
            position: relative;
            background: #111;
        }

        /* Картинка Дурова у круглому контейнері */
        .custom-guy img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        /* Шлейф */
        .custom-guy::after {
            content: '';
            position: absolute;
            left: -16px;
            bottom: 4px;
            width: 18px;
            height: 8px;
            background: linear-gradient(90deg, transparent, #38bdf8);
            border-radius: 4px;
            filter: blur(2px);
        }

        .player-tag {
            background: rgba(10, 10, 15, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 3px 8px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 800;
            color: #ffffff;
        }

        /* Управління ставками */
        .betting-box {
            background: #111116;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 14px;
            margin-top: 12px;
        }

        .betting-info {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 8px;
            font-weight: 800;
        }

        .bet-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .bet-adjuster {
            flex: 1;
            background: #08080c;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .btn-chg {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: #fff;
            width: 30px;
            height: 30px;
            border-radius: 8px;
            font-weight: 900;
            font-size: 16px;
            cursor: pointer;
        }

        .bet-number {
            font-size: 18px;
            font-weight: 900;
        }

        .quick-chips {
            display: flex;
            gap: 5px;
            margin-top: 6px;
        }

        .chip {
            flex: 1;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.7);
            border-radius: 6px;
            padding: 4px 0;
            font-size: 10px;
            font-weight: 900;
            cursor: pointer;
        }

        .btn-main-action {
            width: 130px;
            height: 54px;
            border: none;
            border-radius: 14px;
            font-weight: 900;
            font-size: 14px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.1s ease;
        }

        .btn-main-action:active {
            transform: scale(0.96);
        }

        .btn-style-start {
            background: #ffffff;
            color: #000000;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.25);
        }

        .btn-style-cashout {
            background: #38bdf8;
            color: #000000;
            box-shadow: 0 4px 20px rgba(56, 189, 248, 0.4);
        }

        .btn-return {
            width: 100%;
            margin-top: 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.7);
            padding: 12px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* Навігація */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 65px;
            background-color: rgba(10, 10, 14, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(12px);
        }

        .nav-item {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            height: 100%;
            cursor: pointer;
        }

        .nav-item i {
            font-size: 18px;
            margin-bottom: 4px;
        }

        .nav-item span {
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 0.5px;
        }

        .nav-item.active {
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>

    <!-- Вкладка КАЗИНО (ЛОБІ) -->
    <div id="casino" class="page active">
        <h1 class="page-title">🎰 КАЗИНО</h1>
        
        <div class="game-banner" onclick="openRocketGame()">
            <i class="fa-solid fa-user-astronaut"></i>
            <div class="game-title">ПОЛІТ ДУРОВА</div>
            <div class="game-desc">Динамічний раунд • Ставки на Stars ⭐</div>
        </div>
    </div>

    <!-- ЕКРАН ГРИ -->
    <div id="rocketGamePage" class="page">
        <div class="rg-header">
            <div class="rg-logo">DUROV <span>XORYS</span></div>
            <div class="rg-balance">
                <i class="fa-solid fa-star" style="color: #fff;"></i> <span id="userStars">100</span> ⭐
            </div>
        </div>

        <div class="rg-history">
            <div class="history-pill">4.20x</div>
            <div class="history-pill">1.12x</div>
            <div class="history-pill">2.85x</div>
            <div class="history-pill">1.04x</div>
            <div class="history-pill">7.50x</div>
        </div>

        <!-- Ігрове поле -->
        <div class="rg-display">
            <div class="star-point" style="top: 20%; left: 15%; width: 2px; height: 2px;"></div>
            <div class="star-point" style="top: 70%; left: 80%; width: 3px; height: 3px;"></div>
            <div class="star-point" style="top: 40%; left: 60%; width: 2px; height: 2px;"></div>
            <div class="star-point" style="top: 80%; left: 30%; width: 2px; height: 2px;"></div>

            <div id="multiplierText" class="multiplier-val">x1.00</div>

            <!-- Тут Павло Дуров замість ракети -->
            <div id="rocketObj" class="rocket-container">
                <div class="custom-guy">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/8/8e/Pavel_Durov_in_2011.jpg" alt="Pavel Durov">
                </div>
                <span id="playerNickname" class="player-tag">@user</span>
            </div>
        </div>

        <!-- Управління ставкою -->
        <div class="betting-box">
            <div class="betting-info">
                <span>РОЗМІР СТАВКИ (STARS ⭐)</span>
                <span>АВТОВИВІД x2.00</span>
            </div>
            
            <div class="bet-row">
                <div class="bet-adjuster">
                    <button class="btn-chg" onclick="changeBet(-5)">-</button>
                    <span id="betAmount" class="bet-number">10</span>
                    <button class="btn-chg" onclick="changeBet(5)">+</button>
                </div>
                
                <button id="gameBtn" class="btn-main-action btn-style-start" onclick="handleGameClick()">СТАВКА</button>
            </div>

            <div class="quick-chips">
                <button class="chip" onclick="setBet(10)">10</button>
                <button class="chip" onclick="setBet(25)">25</button>
                <button class="chip" onclick="setBet(50)">50</button>
                <button class="chip" onclick="setBet(100)">100</button>
            </div>
        </div>

        <button class="btn-return" onclick="closeRocketGame()">
            <i class="fa-solid fa-arrow-left"></i> НАЗАД У ЛОБІ
        </button>
    </div>

    <!-- Вкладка МАРКЕТ -->
    <div id="market" class="page">
        <h1 class="page-title">🛒 КАТАЛОГ</h1>
        <div class="catalog-grid">
            <div class="catalog-card" onclick="openCategory('Номери')">
                <div class="card-icon"><i class="fa-solid fa-sim-card"></i></div>
                <div class="card-title">НОМЕРИ</div>
            </div>
            <div class="catalog-card" onclick="openCategory('Звёзды')">
                <div class="card-icon"><i class="fa-solid fa-star"></i></div>
                <div class="card-title">ЗВЁЗДЫ</div>
            </div>
            <div class="catalog-card" onclick="openCategory('TG Premium')">
                <div class="card-icon"><i class="fa-solid fa-gem"></i></div>
                <div class="card-title">TG PREM</div>
            </div>
            <div class="catalog-card" onclick="openCategory('USDT')">
                <div class="card-icon"><i class="fa-solid fa-coins"></i></div>
                <div class="card-title">USDT</div>
            </div>
        </div>
    </div>

    <!-- Вкладка ПРОФІЛЬ -->
    <div id="profile" class="page">
        <h1 class="page-title">👤 ПРОФІЛЬ</h1>
        <p style="text-align: center; color: rgba(255,255,255,0.4); font-weight: 800;">Статистика та гаманець...</p>
    </div>

    <!-- Нижня панель навігації -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchPage('casino', this)">
            <i class="fa-solid fa-dice"></i>
            <span>КАЗИНО</span>
        </button>
        <button class="nav-item" onclick="switchPage('market', this)">
            <i class="fa-solid fa-store"></i>
            <span>МАРКЕТ</span>
        </button>
        <button class="nav-item" onclick="switchPage('profile', this)">
            <i class="fa-solid fa-user"></i>
            <span>ПРОФІЛЬ</span>
        </button>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        const username = tg.initDataUnsafe?.user?.username ? '@' + tg.initDataUnsafe.user.username : '@player';
        document.getElementById('playerNickname').innerText = username;

        let starsBalance = 100;
        let currentBet = 10;
        let isPlaying = false;
        let currentMultiplier = 1.00;
        let gameInterval = null;
        let crashPoint = 0;

        function switchPage(pageId, buttonElement) {
            const pages = document.querySelectorAll('.page');
            pages.forEach(page => page.classList.remove('active'));

            document.getElementById(pageId).classList.add('active');

            if (buttonElement) {
                const buttons = document.querySelectorAll('.nav-item');
                buttons.forEach(btn => btn.classList.remove('active'));
                buttonElement.classList.add('active');
            }
        }

        function openRocketGame() {
            switchPage('rocketGamePage', null);
            tg.HapticFeedback.impactOccurred('medium');
        }

        function closeRocketGame() {
            switchPage('casino', document.querySelectorAll('.nav-item')[0]);
            tg.HapticFeedback.impactOccurred('light');
        }

        function changeBet(amount) {
            currentBet = Math.max(5, currentBet + amount);
            document.getElementById('betAmount').innerText = currentBet;
        }

        function setBet(amount) {
            currentBet = amount;
            document.getElementById('betAmount').innerText = currentBet;
        }

        function handleGameClick() {
            const btn = document.getElementById('gameBtn');
            tg.HapticFeedback.impactOccurred('light');

            if (!isPlaying) {
                if (starsBalance < currentBet) {
                    alert('Недостатньо Stars!');
                    return;
                }

                starsBalance -= currentBet;
                document.getElementById('userStars').innerText = starsBalance;
                isPlaying = true;
                currentMultiplier = 1.00;
                crashPoint = (Math.random() * 3.5 + 1.1).toFixed(2);

                btn.innerText = 'ЗАБРАТИ';
                btn.className = 'btn-main-action btn-style-cashout';

                const rocket = document.getElementById('rocketObj');
                rocket.style.bottom = '25px';
                rocket.style.left = '25px';

                gameInterval = setInterval(() => {
                    currentMultiplier += 0.03;
                    document.getElementById('multiplierText').innerText = 'x' + currentMultiplier.toFixed(2);
                    btn.innerText = `ЗАБРАТИ (${Math.floor(currentBet * currentMultiplier)})`;

                    let currentBottom = parseInt(rocket.style.bottom) || 25;
                    let currentLeft = parseInt(rocket.style.left) || 25;
                    if (currentBottom < 110) rocket.style.bottom = (currentBottom + 1.2) + 'px';
                    if (currentLeft < 200) rocket.style.left = (currentLeft + 2.5) + 'px';

                    if (currentMultiplier >= crashPoint) {
                        endGame(false);
                    }
                }, 100);

            } else {
                endGame(true);
            }
        }

        function endGame(isWin) {
            clearInterval(gameInterval);
            isPlaying = false;
            const btn = document.getElementById('gameBtn');

            if (isWin) {
                const winAmount = Math.floor(currentBet * currentMultiplier);
                starsBalance += winAmount;
                document.getElementById('userStars').innerText = starsBalance;
                tg.HapticFeedback.notificationOccurred('success');
            } else {
                tg.HapticFeedback.notificationOccurred('error');
                document.getElementById('multiplierText').innerText = 'ЗЛИТО! 💥';
            }

            btn.innerText = 'СТАВКА';
            btn.className = 'btn-main-action btn-style-start';
        }

        function openCategory(name) {
            tg.HapticFeedback.impactOccurred('light');
            alert('Обрано: ' + name);
        }
    </script>
</body>
</html>
