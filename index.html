<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XORYS SHOP</title>
    <!-- Підключаємо іконки FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f0f11;
            color: #ffffff;
            padding-bottom: 80px; /* Відступ знизу, щоб контент не перекривався меню */
        }

        /* Стилі для екранів (сторінок) */
        .page {
            display: none;
            padding: 20px;
            text-align: center;
        }

        .page.active {
            display: block;
        }

        h1 {
            margin-top: 40px;
            font-size: 24px;
            color: #f39c12;
        }

        /* Нижня панель навігації */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 65px;
            background-color: #1a1a1e;
            border-top: 1px solid #2d2d35;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }

        /* Кнопки меню */
        .nav-item {
            background: none;
            border: none;
            color: #888893;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            height: 100%;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .nav-item i {
            font-size: 20px;
            margin-bottom: 4px;
        }

        .nav-item span {
            font-size: 11px;
            font-weight: 500;
        }

        /* Активна вкладка */
        .nav-item.active {
            color: #3498db;
        }
    </style>
</head>
<body>

    <!-- Вкладка КАЗИНО -->
    <div id="casino" class="page active">
        <h1>🎰 КАЗИНО</h1>
        <p style="margin-top: 20px; color: #aaa;">Тут буде ваш ігровий функціонал та слоти.</p>
    </div>

    <!-- Вкладка МАРКЕТ -->
    <div id="market" class="page">
        <h1>🛒 МАРКЕТ</h1>
        <p style="margin-top: 20px; color: #aaa;">Тут товари, покупки та інвентар.</p>
    </div>

    <!-- Вкладка ПРОФІЛЬ -->
    <div id="profile" class="page">
        <h1>👤 ПРОФІЛЬ</h1>
        <p style="margin-top: 20px; color: #aaa;">Ваш баланс, статистика та налаштування.</p>
    </div>

    <!-- Нижня панель меню -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchPage('casino', this)">
            <i class="fa-solid fa-dice"></i>
            <span>КАЗИНО</span>
        </button>
        <button class="nav-item" onclick="switchPage('market', this)">
            <i class="fa-solid fa-store"></i>
            <span>МАРКЕТ</span>
        </button>
        <button class="nav-item" onclick="switchPage('profile', this)">
            <i class="fa-solid fa-user"></i>
            <span>ПРОФІЛЬ</span>
        </button>
    </nav>

    <script>
        // Функція перемикання між сторінками та підсвічування активної іконки
        function switchPage(pageId, buttonElement) {
            // Приховуємо всі сторінки
            const pages = document.querySelectorAll('.page');
            pages.forEach(page => page.classList.remove('active'));

            // Показуємо потрібну сторінку
            document.getElementById(pageId).classList.add('active');

            // Знімаємо клас active з усіх кнопок і додаємо на натиснуту
            const buttons = document.querySelectorAll('.nav-item');
            buttons.forEach(btn => btn.classList.remove('active'));
            buttonElement.classList.add('active');
        }
    </script>

</body>
</html>
